<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语启蒙">
<meta name="theme-color" content="#f4f8ff">
<title>英语启蒙乐园</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="ring" id="ring" style="--p:0"><i id="ringText">0</i></div>
    <div class="logo">英语启蒙乐园<small id="subTitle">加载中…</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnParent" title="家长设置">⚙️</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar">
  <button class="tab" data-tab="today"><i>🏠</i>今日</button>
  <button class="tab" data-tab="video"><i>📺</i>看视频</button>
  <button class="tab" data-tab="speak"><i>🗣️</i>跟读</button>
  <button class="tab" data-tab="game"><i>🧩</i>连词</button>
  <button class="tab" data-tab="summary"><i>🏆</i>总结</button>
</nav>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast hidden" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
